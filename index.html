<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaisonPro Mèches — Extensions capillaires à Yaoundé</title>
<meta name="description" content="Cheveux naturels & synthétiques. Des mèches choisies pour durer, pas juste pour la photo.">
<style>
body{background:#FFF8F0;color:#2B1810;font-family:Arial;margin:0}
header{background:#2B1810;color:#FFF8F0;padding:20px;text-align:center}
.produits{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding:20px}
.card{background:white;border:1px solid #D4A373;border-radius:16px;padding:16px;text-align:center}
.card img{width:100%;height:220px;object-fit:cover;border-radius:12px}
.btn{background:#2B1810;color:#FFF8F0;padding:10px 20px;border-radius:20px;border:none}
</style>
</head>
<body>
<header><h1>MaisonPro Mèches</h1><p>Extensions capillaires à Yaoundé</p></header>
<main id="produits" class="produits"></main>
<script>
const produits=[
{nom:"Balayage Doré Ondulé",prix:"45€",img:"./images/balayage-dore-ondule.jpg"},
{nom:"Mèches Blondes Naturelles",prix:"52€",img:"./images/balayage-dore-ondule-2.jpg"},
{nom:"Balayage Miel",prix:"48€",img:"./images/balayage-dore-ondule-3.jpg"}
];
document.getElementById("produits").innerHTML=produits.map(p=>`
<div class="card">
<img src="${p.img}" onerror="this.src='https://via.placeholder.com/300x220?text=Meche+Naturelle'">
<h3>${p.nom}</h3><p style="color:#D4A373;font-weight:bold">${p.prix}</p>
<button class="btn">Voir le détail</button>
</div>`).join("");
</script>
</body>
</html>
